name: Staging Freeze (núcleo)

# Shared logic behind staging-freeze-congelar.yml and staging-freeze-liberar.yml,
# split in two so each button only shows its own fields
on:
  workflow_call:
    inputs:
      accion:
        type: string
        required: true
      motivo:
        type: string
        default: ''
      horas:
        type: number
        default: 4
      forzar:
        type: boolean
        default: false
    secrets:
      STAGING_FREEZE_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

env:
  STAGING_BRANCH: ${{ vars.STAGING_BRANCH }}

jobs:
  toggle:
    # Both buttons queue on one group: a freeze and a release never interleave
    concurrency:
      group: staging-freeze
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Decide and store the new state
        id: state
        env:
          # Repository variables are not writable (or readable live) with GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.STAGING_FREEZE_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACCION: ${{ inputs.accion }}
          MOTIVO: ${{ inputs.motivo }}
          HORAS: ${{ inputs.horas }}
          FORZAR: ${{ inputs.forzar }}
          ACTOR: ${{ github.actor }}
        run: |
          now=$(date -u +%FT%TZ)
          # Live read: vars.* is a snapshot from when the run was queued
          current=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/STAGING_FREEZE" --jq .value 2>/dev/null || true)
          owner=$(jq -r '.by // empty' <<<"$current" 2>/dev/null || true)
          until=$(jq -r '.until // empty' <<<"$current" 2>/dev/null || true)
          active=false
          # A freeze with no expiry holds until someone releases it
          if [ -n "$owner" ] && { [ -z "$until" ] || [[ "$until" > "$now" ]]; }; then active=true; fi
          if [ -n "$until" ]; then
            span="hasta $(TZ=America/Bogota date -d "$until" +%H:%M)"
          else
            span="sin vencimiento"
          fi
          held_by="@$owner $span: $(jq -r '.reason // empty' <<<"$current" 2>/dev/null || true)"

          if [ "$EVENT" = schedule ]; then
            if [ "$active" = true ]; then
              echo "Sigue congelado ($span)"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ACCION=liberar
          # Only the owner may extend their freeze or release it; others must force a release
          elif [ "$active" = true ] && [ "$owner" != "$ACTOR" ]; then
            if [ "$ACCION" = congelar ]; then
              echo "::error::Staging ya está congelado por $held_by"
              exit 1
            elif [ "$FORZAR" != true ]; then
              echo "::error::Staging está congelado por $held_by. Para liberarlo igual, marca 'forzar'"
              exit 1
            fi
            echo "⚠️ Liberación forzada por @$ACTOR del congelamiento de $held_by" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ACCION" = congelar ]; then
            if [ -z "$MOTIVO" ]; then
              echo "::error::El motivo es obligatorio al congelar"
              exit 1
            fi
            if ! [[ "$HORAS" =~ ^[0-9]+$ ]] || [ "$HORAS" -gt 24 ]; then
              echo "::error::horas debe ser un entero entre 0 y 24 (recibido: $HORAS)"
              exit 1
            fi
            if [ "$HORAS" -eq 0 ]; then
              until=''
              span="sin vencimiento"
            else
              until=$(date -u -d "+$HORAS hours" +%FT%TZ)
              span="hasta $(TZ=America/Bogota date -d "$until" '+%F %H:%M') (Bogotá)"
            fi
            freeze=$(jq -nc --arg by "$ACTOR" --arg reason "$MOTIVO" --arg until "$until" \
              '{by: $by, reason: $reason, until: $until}')
            gh variable set STAGING_FREEZE --repo "$GITHUB_REPOSITORY" --body "$freeze"
            echo "🧊 Staging congelado por @$ACTOR $span: $MOTIVO" >> "$GITHUB_STEP_SUMMARY"
          else
            freeze=''
            if [ -n "$current" ]; then
              gh variable delete STAGING_FREEZE --repo "$GITHUB_REPOSITORY"
            fi
            who=$([ "$EVENT" = schedule ] && echo "vencimiento automático" || echo "@$ACTOR")
            echo "✅ Staging liberado ($who)" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "changed=true"
            echo "accion=$ACCION"
            echo "freeze=$freeze"
          } >> "$GITHUB_OUTPUT"

      - name: List open PRs to staging
        id: prs
        if: steps.state.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "shas<<EOF"
            gh pr list --repo "$GITHUB_REPOSITORY" --base "$STAGING_BRANCH" --state open \
              --limit 200 --json headRefOid --jq '.[].headRefOid'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh staging-freeze status on open PRs
        if: steps.state.outputs.changed == 'true'
        uses: ./.github/actions/staging-freeze-status
        with:
          freeze: ${{ steps.state.outputs.freeze }}
          shas: ${{ steps.prs.outputs.shas }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Production pushes skip the sync while frozen; catch staging up now
      - name: Resume production → staging sync
        if: steps.state.outputs.accion == 'liberar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-production-to-staging.yml --repo "$GITHUB_REPOSITORY" --ref production
